[package]
name = "adbmdns_bridge"
version = "0.1.0"
edition = "2024"

[lib]
path = "adbmdns_bridge.rs"
crate-type = ["staticlib"]

[dependencies]
anyhow = "=1.0.102"
if-addrs = "=0.14.0"
libc = "=0.2.183"
log = { version = "=0.4.29", features = ["std"] }
mio = { version = "=1.1.1", features = ["net", "os-poll"] }
nix = { version = "=0.29.0", features = ["net", "socket", "uio"] }
simple-dns = "=0.11.2"
socket2 = { version = "=0.6.3", features = ["all"] }
zerocopy = { version = "=0.8.39", features = ["derive", "std"] }
